name: Build Android APK

# Builds the Medicine Assistant APK with Buildozer (Kivy) on every push to
# main - and also on manual "Run workflow" (Actions tab > Run workflow).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Java 21 (required by the modern Android SDK)
        run: sudo apt-get update && sudo apt-get install -y openjdk-21-jdk-headless

      - name: Install buildozer + a modern Cython
        run: |
          pip install --upgrade pip
          pip install buildozer
          # python-for-android needs Cython 3.x; force-reinstall wins even
          # when an older Cython is preinstalled on the runner
          pip install --force-reinstall "cython>=3.1"

      - name: Build the APK (debug, arm64) + kivy-recipe Cython3 fix watcher
        working-directory: android_build
        env:
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
          MAX_JOBS: "2"
        run: |
          # The stock p4a kivy recipe imports `old_build_ext` from
          # Cython.Distutils, which Cython 3 removed -> build error.
          # This background watcher waits until buildozer downloads
          # python-for-android, patches that import, and stays quiet if
          # the file never appears (newer fixed recipes).
          (
            for i in $(seq 1 240); do
              f=$(find ~/.buildozer -path "*recipes/kivy/__init__.py" 2>/dev/null | head -1)
              if [ -n "$f" ] && grep -q "from Cython.Distutils import old_build_ext" "$f"; then
                sed -i 's/from Cython.Distutils import old_build_ext/try: from Cython.Distutils.old_build_ext import old_build_ext\nexcept ImportError: from setuptools._distutils.command.build_ext import build_ext as old_build_ext/' "$f"
                echo "kivy recipe patched for Cython 3: $f"
                break
              fi
              sleep 10
            done
          ) &
          yes | buildozer -v android debug

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: medicine-assistant-apk
          path: android_build/bin/*.apk
