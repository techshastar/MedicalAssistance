name: Build Android APK

# Builds the Medicine Assistant APK with Buildozer (Kivy) on every push to
# main - and also on manual "Run workflow" (Actions tab > Run workflow).
#
# v2 fix: ubuntu-latest (ubuntu24) runners no longer ship libltdl-dev, which
# libffi's autogen.sh needs (error: "possibly undefined macro:
# LT_SYS_SYMBOL_USCORE"). We now install the full system dependency set
# recommended by buildozer/python-for-android, including libltdl-dev.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Java 21 + build tools (autoconf/automake/libtool/libltdl-dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-21-jdk-headless \
            git zip unzip \
            autoconf automake autopoint gettext \
            libtool libltdl-dev \
            pkg-config cmake \
            zlib1g-dev libffi-dev libssl-dev libncurses-dev

      - name: Install buildozer + a modern Cython
        run: |
          pip install --upgrade pip
          pip install buildozer
          # python-for-android recipes build happily with Cython 3.x;
          # buildozer itself pulls cython 0.29, so force-reinstall wins
          pip install --force-reinstall "cython>=3.1"

      - name: Build the APK (debug, arm64) + kivy-recipe Cython3 fix watcher
        working-directory: android_build
        env:
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
          MAX_JOBS: "2"
        run: |
          # Safety net only: if an OLD python-for-android kivy recipe is
          # ever used, its `old_build_ext` import breaks on Cython 3.
          # This watcher patches it in place. On current p4a master the
          # recipe is already fixed, so this stays a silent no-op.
          # (Search BOTH possible .buildozer locations.)
          (
            for i in $(seq 1 240); do
              f=$(find ~/.buildozer ./.buildozer -path "*recipes/kivy/__init__.py" 2>/dev/null | head -1)
              if [ -n "$f" ] && grep -q "from Cython.Distutils import old_build_ext" "$f"; then
                sed -i 's/from Cython.Distutils import old_build_ext/try: from Cython.Distutils.old_build_ext import old_build_ext\nexcept ImportError: from setuptools._distutils.command.build_ext import build_ext as old_build_ext/' "$f"
                echo "kivy recipe patched for Cython 3: $f"
                break
              fi
              sleep 10
            done
          ) &
          yes | buildozer -v android debug

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: medicine-assistant-apk
          path: android_build/bin/*.apk
